services:
  postgres-development:
    image: postgres:17
    environment:
      POSTGRES_DB: fall_development
      POSTGRES_USER: fall_local
      POSTGRES_PASSWORD: fall_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-development-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fall_local -d fall_development"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_DB: fall_test
      POSTGRES_USER: fall_local
      POSTGRES_PASSWORD: fall_local_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fall_local -d fall_test"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-development-data:
