[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-finance"
version = "0.1.0"
description = "Backend da aplicação Fall"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
fall-worker = "fall.worker.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"fall.persistence.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
